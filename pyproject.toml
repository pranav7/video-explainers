[project]
name = "explainer"
version = "0.3.0"
description = "Local narrated explainers with Manim, natural cloned Qwen/MLX speech, pronunciation controls and layout checks"
readme = "README.md"
license = "MIT"
authors = [{ name = "Pranav" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "manim>=0.22.1,<0.23",
  "kokoro>=0.9.4",
  "soundfile",
  "mlx-audio[tts]==0.6.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  # kokoro does not bound transformers; without this the resolver picks 4.12, which fails to build
  "transformers>=4.45",
  # misaki downloads this at runtime on first use; pin it so the env is complete after `uv sync`
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.urls]
Repository = "https://github.com/pranav7/video-explainers"

[project.scripts]
explainer = "explainer.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
# For the en-core-web-sm wheel URL in dependencies.
allow-direct-references = true
